<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <!-- 现代蓝色渐变背景 -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4FACFE"/>
            <stop offset="100%" stop-color="#00F2FE"/>
        </linearGradient>
        
        <!-- 用于增加科技感的微发光效果 -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- 背景圆角矩形 -->
    <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

    <!-- 背景装饰：代表“管理系统”的虚线圆和网格节点 -->
    <g opacity="0.15" fill="none" stroke="white" stroke-width="2">
        <!-- 连接线 -->
        <line x1="100" y1="200" x2="130" y2="200" />
        <line x1="130" y1="200" x2="150" y2="180" />
        <line x1="150" y1="180" x2="150" y2="150" />
        <!-- 节点 -->
        <circle cx="100" cy="200" r="4" fill="white" />
        <circle cx="130" cy="200" r="4" fill="white" />
        <circle cx="150" cy="180" r="4" fill="white" />
        <circle cx="150" cy="150" r="4" fill="white" />
        <!-- 另一侧 -->
        <line x1="400" y1="360" x2="420" y2="340" />
        <line x1="420" y1="340" x2="440" y2="340" />
        <line x1="440" y1="340" x2="460" y2="320" />
        <circle cx="400" cy="360" r="4" fill="white" />
        <circle cx="420" cy="340" r="4" fill="white" />
        <circle cx="440" cy="340" r="4" fill="white" />
        <circle cx="460" cy="320" r="4" fill="white" />
    </g>

    <!-- 主体：显示器 -->
    <g>
        <!-- 显示器支架 -->
        <rect x="210" y="330" width="40" height="30" fill="white" opacity="0.6" />
        <!-- 显示器底座 -->
        <rect x="170" y="360" width="120" height="16" rx="8" fill="white" opacity="0.6" />
        <!-- 显示器屏幕外壳 -->
        <rect x="130" y="170" width="200" height="160" rx="20" fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="6" />
        
        <!-- 屏幕内的科技图表（数据趋势线） -->
        <g filter="url(#glow)">
            <polyline points="150,210 170,195 190,220 230,185 260,200" fill="none" stroke="white" opacity="0.5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="150" cy="210" r="4" fill="white" opacity="0.8" />
            <circle cx="170" cy="195" r="4" fill="white" opacity="0.8" />
            <circle cx="190" cy="220" r="4" fill="white" opacity="0.8" />
            <circle cx="230" cy="185" r="4" fill="white" opacity="0.8" />
            <circle cx="260" cy="200" r="4" fill="white" opacity="0.8" />
        </g>

        <!-- 屏幕内的烧瓶 -->
        <g>
            <!-- 烧瓶主体路径 -->
            <path d="M 215 190 h 30 v 30 l 25 70 h -80 l 25 -70 z" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" />
            
            <!-- 烧瓶内的液体水平线 -->
            <line x1="200" y1="265" x2="260" y2="265" stroke="white" stroke-width="6" stroke-linecap="round" />
            
            <!-- 烧瓶内的气泡 -->
            <circle cx="225" cy="245" r="5" fill="white" />
            <circle cx="245" cy="255" r="3" fill="white" />
            <circle cx="210" cy="258" r="4" fill="white" />
            <circle cx="235" cy="275" r="2" fill="white" />

            <!-- 烧瓶高光（玻璃光泽） -->
            <path d="M 222 196 h 16 v 28 l 18 50" fill="none" stroke="white" opacity="0.4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
            
            <!-- 烧瓶口 -->
            <line x1="215" y1="180" x2="245" y2="180" stroke="white" stroke-width="8" stroke-linecap="round" />
        </g>
    </g>

    <!-- 副体：试管 -->
    <g>
        <!-- 试管管口边缘 -->
        <line x1="360" y1="180" x2="420" y2="180" stroke="white" stroke-width="8" stroke-linecap="round" />
        
        <!-- 试管主体路径 -->
        <path d="M 375 190 L 405 190 L 405 300 Q 405 330 390 330 Q 375 330 375 300 Z" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="8" stroke-linejoin="round" />
        
        <!-- 试管内的液体水平线 -->
        <line x1="383" y1="290" x2="397" y2="290" stroke="white" stroke-width="6" stroke-linecap="round" />
        
        <!-- 试管内的气泡 -->
        <circle cx="390" cy="280" r="4" fill="white" />
        <circle cx="395" cy="270" r="2" fill="white" />
        <circle cx="385" cy="310" r="2" fill="white" />

        <!-- 试管高光（玻璃光泽） -->
        <path d="M 382 196 L 395 196 L 395 280" fill="none" stroke="white" opacity="0.4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
</svg>